app-id: net.x2go.client
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: x2goclient

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --filesystem=/tmp
  - --filesystem=xdg-run/gnupg:ro
  # Allow access to host SSH
  - --filesystem=/usr/bin/ssh:ro
  - --filesystem=/usr/bin/scp:ro
  - --filesystem=/usr/bin/ssh-keygen:ro
  - --filesystem=~/.ssh:ro
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.impl.portal.Notification
  # Allow running host commands (for ssh)
  - --talk-name=org.freedesktop.Flatpak

modules:
  # Create wrapper scripts for host ssh binaries
  - name: openssh
    buildsystem: simple
    build-commands:
      # Create symlinks to host ssh binaries
      - mkdir -p /app/bin
      - echo '#!/bin/sh' > /app/bin/ssh
      - echo 'exec /usr/bin/ssh "$@"' >> /app/bin/ssh
      - chmod +x /app/bin/ssh
      - echo '#!/bin/sh' > /app/bin/scp
      - echo 'exec /usr/bin/scp "$@"' >> /app/bin/scp
      - chmod +x /app/bin/scp
      - echo '#!/bin/sh' > /app/bin/ssh-keygen
      - echo 'exec /usr/bin/ssh-keygen "$@"' >> /app/bin/ssh-keygen
      - chmod +x /app/bin/ssh-keygen
    sources: []

  # libssh is required for x2goclient
  - name: libssh
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DWITH_GSSAPI=OFF
      - -DWITH_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://www.libssh.org/files/0.10/libssh-0.10.6.tar.xz
        sha256: 1861d498f5b6f1741b6571b5f1d58e74daff13be8de099d58db7ee2c5035e0bc
    post-install:
      # Ensure pkgconfig and libraries are in expected locations
      - |
        if [ -d /app/lib64 ] && [ ! -d /app/lib/pkgconfig ]; then
          mkdir -p /app/lib/pkgconfig
          if [ -f /app/lib64/pkgconfig/libssh.pc ]; then
            cp /app/lib64/pkgconfig/libssh.pc /app/lib/pkgconfig/
          fi
        fi
      - |
        if [ -d /app/lib64 ] && [ ! -f /app/lib/libssh.so ]; then
          for f in /app/lib64/libssh*; do
            if [ -f "$f" ]; then
              ln -sf "$f" /app/lib/$(basename "$f")
            fi
          done
        fi
      # Debug: List what was installed
      - ls -la /app/lib/ || true
      - ls -la /app/lib/pkgconfig/ || true
      - cat /app/lib/pkgconfig/libssh.pc || true

  - name: x2goclient
    buildsystem: qmake
    build-options:
      env:
        PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/lib64/pkgconfig
        LDFLAGS: -L/app/lib -L/app/lib64
        CPPFLAGS: -I/app/include
        QMAKE_LIBDIR: /app/lib /app/lib64
        QMAKE_INCDIR: /app/include
    config-opts:
      - PREFIX=/app
      - QMAKE_LIBDIR+=/app/lib
      - QMAKE_LIBDIR+=/app/lib64
      - QMAKE_INCDIR+=/app/include
      - LIBS+=-L/app/lib
      - LIBS+=-L/app/lib64
    sources:
      - type: archive
        url: https://code.x2go.org/releases/source/x2goclient/x2goclient-4.1.2.3.tar.gz
        sha256: ab8bb3c78d31625c749e42f15f810fe3d242927a15298308c13dea3b915aca3c
    post-install:
      - install -Dm755 x2goclient /app/bin/x2goclient
      - |
        if [ -f x2goclient.desktop ]; then
          install -Dm644 x2goclient.desktop /app/share/applications/net.x2go.client.desktop
        fi
      - |
        for icon in x2goclient.png x2goclient-*.png; do
          if [ -f "$icon" ]; then
            install -Dm644 "$icon" "/app/share/icons/hicolor/$(basename $icon .png | grep -oE '[0-9]+' | tail -1)x$(basename $icon .png | grep -oE '[0-9]+' | tail -1)/apps/net.x2go.client.png"
          fi
        done
      - |
        if [ ! -f /app/share/applications/net.x2go.client.desktop ]; then
          cat > /app/share/applications/net.x2go.client.desktop << 'EOF'
        [Desktop Entry]
        Version=1.0
        Type=Application
        Name=X2Go Client
        Comment=Remote desktop client for X2Go
        Icon=net.x2go.client
        Exec=x2goclient
        Terminal=false
        Categories=Network;RemoteAccess;
        EOF
        fi
