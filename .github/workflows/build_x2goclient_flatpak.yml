name: build_x2goclient_flatpak
run-name: Build X2GoClient Flatpak ${{ github.event.inputs.version || 'latest' }}
on:
  push:
    paths:
      - '.github/workflows/build_x2goclient_flatpak.yml'
      - '.github/recipes/net.x2go.client.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the release'  
        type: string   
        required: false
        default: 'latest'
      manifest_url:
        description: 'URL to the Flatpak manifest (default: local recipe in this repo)'  
        type: string   
        required: false
        default: '.github/recipes/net.x2go.client.yml'

jobs:
  build_flatpak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flatpak and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.kde.Platform//5.15-23.08 org.kde.Sdk//5.15-23.08

      - name: Determine release name
        id: tag
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || 'latest' }}"
          echo "name=X2GoClient-Flatpak-${VERSION}-b${BUILD_NUMBER}-${SHORT_HASH}" >> $GITHUB_OUTPUT

      - name: Download Flatpak manifest
        run: |
          MANIFEST_PATH="${{ github.event.inputs.manifest_url || '.github/recipes/net.x2go.client.yml' }}"
          echo "Using Flatpak manifest from: $MANIFEST_PATH"
          
          # Check if it's a URL or local file
          if [[ "$MANIFEST_PATH" == http* ]]; then
            mkdir -p flatpak-build
            cd flatpak-build
            wget -c "$MANIFEST_PATH" -O manifest.yml
          else
            # It's a local file path
            mkdir -p flatpak-build
            cp "$MANIFEST_PATH" flatpak-build/manifest.yml
          fi
          
          # Extract the app ID from the manifest
          APP_ID=$(grep "^app-id:" flatpak-build/manifest.yml | awk '{print $2}')
          echo "APP_ID=$APP_ID" >> $GITHUB_ENV
          echo "Application ID: $APP_ID"
          
          ls -lh flatpak-build/manifest.yml

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: X2GoClient-${{ github.event.inputs.version || 'latest' }}.flatpak
          manifest-path: flatpak-build/manifest.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          release_name: ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false

      - name: Find Flatpak bundle
        id: find_bundle
        run: |
          VERSION="${{ github.event.inputs.version || 'latest' }}"
          BUNDLE_NAME="X2GoClient-${VERSION}.flatpak"
          
          # Search for the bundle in common locations
          echo "Searching for ${BUNDLE_NAME}..."
          
          # Check current directory
          if [ -f "${BUNDLE_NAME}" ]; then
            echo "bundle_path=${PWD}/${BUNDLE_NAME}" >> $GITHUB_OUTPUT
            echo "Found at: ${PWD}/${BUNDLE_NAME}"
          # Check workspace root
          elif [ -f "${{ github.workspace }}/${BUNDLE_NAME}" ]; then
            echo "bundle_path=${{ github.workspace }}/${BUNDLE_NAME}" >> $GITHUB_OUTPUT
            echo "Found at: ${{ github.workspace }}/${BUNDLE_NAME}"
          else
            # Find it anywhere
            FOUND=$(find ${{ github.workspace }} -name "${BUNDLE_NAME}" -type f 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              echo "bundle_path=${FOUND}" >> $GITHUB_OUTPUT
              echo "Found at: ${FOUND}"
            else
              echo "Bundle not found!"
              echo "Listing workspace contents:"
              ls -la ${{ github.workspace }}
              find ${{ github.workspace }} -name "*.flatpak" -type f 2>/dev/null
            fi
          fi
          
          echo "bundle_name=${BUNDLE_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Flatpak to Release
        id: upload_release
        uses: actions/github-script@v3
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |          
            const path = require('path');
            const fs = require('fs');
            
            // Retrieve necessary information
            const release_id = `${{ steps.create_release.outputs.id }}`;
            const release_url = `${{ steps.create_release.outputs.html_url }}`;
  
            let releaseDescription = '# X2GoClient Flatpak Release\n\n';
            releaseDescription += `Built from: ${{ github.event.inputs.manifest_url || '.github/recipes/net.x2go.client.yml' }}\n\n`;
            releaseDescription += `**Build Information:**\n`;
            releaseDescription += `- Version: ${{ github.event.inputs.version || 'latest' }}\n`;
            releaseDescription += `- Build Number: ${{ steps.tag.outputs.name }}\n`;
            releaseDescription += `- Date: ${new Date().toISOString()}\n\n`;
            releaseDescription += `**Installation:**\n`;
            releaseDescription += `\`\`\`bash\n`;
            releaseDescription += `# Install the Flatpak bundle\n`;
            releaseDescription += `flatpak install --user X2GoClient-*.flatpak\n\n`;
            releaseDescription += `# Run X2GoClient\n`;
            releaseDescription += `flatpak run net.x2go.client\n`;
            releaseDescription += `\`\`\`\n\n`;
            releaseDescription += `**Prerequisites:**\n`;
            releaseDescription += `- Flatpak must be installed on your system\n`;
            releaseDescription += `- OpenSSH must be installed on your system (the Flatpak uses host SSH)\n`;
            releaseDescription += `- For most distributions: \`sudo apt install flatpak openssh-client\` (Debian/Ubuntu) or equivalent\n\n`;
            releaseDescription += `**Manifest:**\n`;
            releaseDescription += `This Flatpak was built using the X2GoClient manifest.\n`;
  
            // Update the release with the description
            await github.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id,
                body: releaseDescription,
            });
          
            // Upload the Flatpak bundle file
            const bundlePath = '${{ steps.find_bundle.outputs.bundle_path }}';
            const bundleName = '${{ steps.find_bundle.outputs.bundle_name }}';
            
            if (!bundlePath || !fs.existsSync(bundlePath)) {
              console.warn('Flatpak bundle not found at:', bundlePath);
              console.log('Note: The bundle is still available as a GitHub artifact.');
              return;
            }
            
            console.log('Uploading Flatpak bundle:', bundlePath);
            try {
              await github.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release_id,
                name: bundleName,
                data: fs.readFileSync(bundlePath)
              });
              console.log('Successfully uploaded Flatpak bundle');
            } catch (error) {
              console.error('Failed to upload Flatpak bundle:', error.message);
            }
