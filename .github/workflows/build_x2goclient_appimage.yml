name: build_x2goclient_appimage
run-name: Build X2GoClient AppImage ${{ github.event.inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the release'  
        type: string   
        required: false
        default: 'latest'
      recipe_url:
        description: 'URL to the pkg2appimage recipe (default: X2GoClient from AppImageCommunity)'  
        type: string   
        required: false
        default: 'https://raw.githubusercontent.com/AppImageCommunity/pkg2appimage/master/recipes/X2GoClient.yml'

jobs:
  build_appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release name
        id: tag
        shell: bash
        run: |
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          SHORT_HASH="$(git rev-parse --short=7 HEAD)"
          echo "name=X2GoClient-AppImage-${{ github.event.inputs.version }}-b${BUILD_NUMBER}-${SHORT_HASH}" >> $GITHUB_OUTPUT
          echo "X2GoClient-AppImage-${{ github.event.inputs.version }}-b${BUILD_NUMBER}-${SHORT_HASH}"

      - name: Install pkg2appimage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            fuse \
            libfuse2 \
            imagemagick \
            appstream \
            desktop-file-utils

      - name: Download pkg2appimage AppImage
        run: |
          mkdir -p build
          cd build
          
          echo "Downloading pkg2appimage AppImage..."
          wget -c $(wget -q https://api.github.com/repos/AppImageCommunity/pkg2appimage/releases -O - | grep "pkg2appimage-.*-x86_64.AppImage" | grep browser_download_url | head -n 1 | cut -d '"' -f 4)
          
          # Rename to avoid filename issues
          mv pkg2appimage-*-x86_64.AppImage pkg2appimage.AppImage
          chmod +x ./pkg2appimage.AppImage
          
          echo "pkg2appimage AppImage downloaded and made executable"
          ls -lh pkg2appimage.AppImage

      - name: Build X2GoClient AppImage
        run: |
          mkdir -p ${{ github.workspace }}/artifacts
          cd build
          
          # Download the recipe
          RECIPE="${{ github.event.inputs.recipe_url }}"
          echo "Building X2GoClient AppImage from recipe: $RECIPE"
          
          wget -c "$RECIPE" -O X2GoClient.yml
          
          # Extract the AppImage to avoid bundled GLib/libselinux conflicts
          echo "Extracting pkg2appimage AppImage..."
          ./pkg2appimage.AppImage --appimage-extract
          
          # Create a host-safe AppRun that doesn't export bundled libraries
          # This avoids the glib-compile-schemas symbol lookup errors
          echo "Creating host-safe AppRun wrapper..."
          sed -e 's/^export PATH=.*/# export PATH suppressed to use host binaries/' \
              -e 's/^export LD_LIBRARY_PATH=.*/# export LD_LIBRARY_PATH suppressed to avoid bundled libs/' \
              -e 's/^export XDG_DATA_DIRS=.*/# export XDG_DATA_DIRS suppressed/' \
              squashfs-root/AppRun > squashfs-root/AppRun-host
          chmod +x squashfs-root/AppRun-host
          
          # Run pkg2appimage with the recipe using the host-safe AppRun
          echo "Running pkg2appimage to build X2GoClient AppImage..."
          bash squashfs-root/AppRun-host X2GoClient.yml || true
          
          # Copy the built AppImage from out/ directory to artifacts
          if [ -d "out" ]; then
            find out -maxdepth 1 -name "*.AppImage" -type f -exec cp {} ${{ github.workspace }}/artifacts/ \;
          fi
          
          echo "Build complete. Generated files:"
          ls -lh ${{ github.workspace }}/artifacts/

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          release_name: ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false

      - name: Upload AppImage to Release
        id: upload_release
        uses: actions/github-script@v3
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |          
            const path = require('path');
            const fs = require('fs');
            
            // Retrieve necessary information
            const release_id = `${{ steps.create_release.outputs.id }}`;
            const release_url = `${{ steps.create_release.outputs.html_url }}`;
  
            let releaseDescription = '# X2GoClient AppImage Release\n\n';
            releaseDescription += `Built from: ${{ github.event.inputs.recipe_url }}\n\n`;
            releaseDescription += `**Build Information:**\n`;
            releaseDescription += `- Version: ${{ github.event.inputs.version }}\n`;
            releaseDescription += `- Build Number: ${{ steps.tag.outputs.name }}\n`;
            releaseDescription += `- Date: ${new Date().toISOString()}\n\n`;
            releaseDescription += `**Installation:**\n`;
            releaseDescription += `1. Download the X2GoClient AppImage file\n`;
            releaseDescription += `2. Make it executable: \`chmod +x X2GoClient*.AppImage\`\n`;
            releaseDescription += `3. Run it: \`./X2GoClient*.AppImage\`\n\n`;
            releaseDescription += `**Recipe:**\n`;
            releaseDescription += `This AppImage was built using the [X2GoClient recipe](https://github.com/AppImageCommunity/pkg2appimage/blob/master/recipes/X2GoClient.yml) from the AppImageCommunity project.\n`;
  
            // Update the release with the description
            await github.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id,
                body: releaseDescription,
            });
          
            // Upload all AppImage files found in artifacts directory
            const artifactDir = './artifacts';
            
            if (!fs.existsSync(artifactDir)) {
              console.warn('No artifacts directory found');
              return;
            }
            
            const files = fs.readdirSync(artifactDir);
            
            if (files.length === 0) {
              console.warn('No files found in artifacts directory');
              return;
            }
            
            for (let file of files) {
                // Skip pkg2appimage.AppImage
                if (file === 'pkg2appimage.AppImage') {
                  console.log('Skipping:', file);
                  continue;
                }
                console.log('Uploading artifact:', file);
                try {
                  await github.repos.uploadReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: release_id,
                    name: file,
                    data: await fs.readFileSync(`${artifactDir}/${file}`)
                  });
                  console.log('Successfully uploaded:', file);
                } catch (error) {
                  console.error(`Failed to upload ${file}:`, error.message);
                }
            }
