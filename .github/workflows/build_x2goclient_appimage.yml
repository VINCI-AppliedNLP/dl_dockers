name: Build X2GoClient AppImage

on:
  push:
    paths:
      - '.github/workflows/build_x2goclient_appimage.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the release (e.g., 1.0.0)'
        type: string
        required: false
        default: 'latest'

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Qt and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            qtbase5-dev-tools \
            qttools5-dev \
            libqt5svg5-dev \
            libqt5x11extras5-dev \
            libssh-dev \
            libldap2-dev \
            libcups2-dev \
            libxpm-dev \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libfuse2 \
            file
            
      - name: Clone and build x2goclient
        run: |
          git clone https://github.com/xypron/x2goclient.git
          cd x2goclient
          qmake x2goclient.pro CONFIG+=release PREFIX=/usr
          make -j$(nproc)
          make install INSTALL_ROOT=../AppDir
          
      - name: Create desktop file
        run: |
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/x2goclient.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=X2Go Client
          Comment=Connect to X2Go servers
          Exec=x2goclient
          Icon=x2goclient
          Categories=Network;RemoteAccess;
          Terminal=false
          EOF
          
      - name: Setup icon
        run: |
          mkdir -p AppDir/usr/share/icons/hicolor/128x128/apps
          # Try to find and copy icon from source
          if [ -f x2goclient/res/img/x2goclient.png ]; then
            cp x2goclient/res/img/x2goclient.png AppDir/usr/share/icons/hicolor/128x128/apps/
          else
            # Search for any x2go icon
            find x2goclient -name "x2go*.png" -type f | head -1 | xargs -I {} cp {} AppDir/usr/share/icons/hicolor/128x128/apps/x2goclient.png || echo "No icon found, continuing without icon"
          fi
          
      - name: Download linuxdeploy and Qt plugin
        run: |
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          
      - name: Create AppImage
        run: |
          export QMAKE=/usr/bin/qmake
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage \
            --desktop-file AppDir/usr/share/applications/x2goclient.desktop
            
      - name: Determine version and rename AppImage
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ -n "${{ github.event.inputs.version }}" && "${{ github.event.inputs.version }}" != "latest" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="latest-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          mv X2Go_Client*.AppImage x2goclient-${VERSION}-x86_64.AppImage 2>/dev/null || \
          mv x2goclient*.AppImage x2goclient-${VERSION}-x86_64.AppImage 2>/dev/null || \
          mv *.AppImage x2goclient-${VERSION}-x86_64.AppImage
          echo "Built: x2goclient-${VERSION}-x86_64.AppImage"
          ls -lh *.AppImage
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: x2goclient-appimage
          path: x2goclient-*.AppImage
          
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: x2goclient-*.AppImage
          body: |
            ## X2Go Client AppImage
            
            **Version:** ${{ steps.version.outputs.version }}
            
            ### Installation
            1. Download the AppImage file
            2. Make it executable: `chmod +x x2goclient-*.AppImage`
            3. Run it: `./x2goclient-*.AppImage`
            
            Built with linuxdeploy and Qt plugin.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
